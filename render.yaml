services:
  - type: web
    name: memo-wa-bridge
    runtime: node
    region: singapore
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: memo-wa-auth
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: MEMO_AUTH_DIR
        value: /var/data/auth_info_baileys
      - key: MEMO_GATEWAY_TOKEN
        generateValue: true
