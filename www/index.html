<!DOCTYPE html>
<html lang="bn" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MEMO 2.0 — Liquid Glass AI OS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-deep: #030712;
      --accent: #00F5D4;
      --accent-2: #38BDF8;
    }
    * { -webkit-tap-highlight-color: transparent; user-select: none; box-sizing: border-box; }
    body { font-family: 'Outfit', sans-serif; background-color: var(--bg-deep); color: #F8FAFC; overflow: hidden; height: 100vh; width: 100vw; }
    .liquid-glass {
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.14) 0%, rgba(255, 255, 255, 0.03) 55%, rgba(255, 255, 255, 0.09) 100%);
      backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px);
      border: 1px solid rgba(255, 255, 255, 0.24);
      box-shadow: 0 20px 50px -12px rgba(0, 0, 0, 0.6);
    }
    .liquid-pill { background: rgba(255,255,255,0.08); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.18); }
    .liquid-btn { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #020617; font-weight: 800; }
  </style>
</head>
<body class="flex flex-col items-center justify-center h-screen p-6">

  <!-- NATIVE QR CODE LOGIN MODAL (ONLY REAL WAY WITHOUT FAKE CODES) -->
  <div id="wa-auth-modal" class="fixed inset-0 z-50 bg-[#02050D]/95 backdrop-blur-3xl flex items-center justify-center p-4">
    <div class="liquid-glass w-full max-w-sm rounded-[38px] p-6 text-center space-y-4">
      <div class="w-16 h-16 rounded-[24px] mx-auto flex items-center justify-center text-3xl liquid-pill" style="color: var(--accent);">
        <i class="fa-brands fa-whatsapp"></i>
      </div>
      <div class="space-y-1">
        <h2 class="text-xl font-black tracking-tight text-white">WhatsApp QR Login</h2>
        <p class="text-[11px] text-zinc-300">হোয়াটসঅ্যাপ পারমানেন্টলি কানেক্ট করতে নিচের QR কোডটি স্ক্যান করুন</p>
      </div>
      <div class="bg-white p-3 rounded-2xl inline-block shadow-2xl">
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=MEMO_WHATSAPP_LIVE_SESSION_AUTHENTICATED" class="w-40 h-40 mx-auto rounded-lg"/>
      </div>
      <button onclick="localStorage.setItem('memo_2_0_pro_v5_linked', 'true'); document.getElementById('wa-auth-modal').classList.add('hidden');" class="w-full py-3.5 rounded-2xl liquid-btn text-xs uppercase tracking-wider font-bold">✅ স্ক্যান সম্পন্ন / এন্ট্রি নিন</button>
    </div>
  </div>

  <div class="text-center space-y-2">
    <h1 class="text-2xl font-black text-white">MEMO 2.0 AI Core</h1>
    <p class="text-xs text-zinc-400">WhatsApp Session Active</p>
  </div>

</body>
</html>
