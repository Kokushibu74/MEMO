<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MEMO Pro — Kokushibu74</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body { background-color: #090d16; color: #f1f5f9; font-family: system-ui, -apple-system, sans-serif; }
    .glass { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
  </style>
</head>
<body class="min-h-screen flex flex-col pb-24">

  <!-- Top App Bar -->
  <header class="sticky top-0 z-30 glass border-b border-slate-800/80 px-4 py-3.5 flex items-center justify-between">
    <div class="flex items-center gap-2.5">
      <div class="h-9 w-9 rounded-xl bg-gradient-to-br from-indigo-500 to-cyan-400 flex items-center justify-center font-black text-slate-950 shadow-lg shadow-indigo-500/20">
        M
      </div>
      <div>
        <h1 class="text-base font-extrabold tracking-tight text-white flex items-center gap-1.5">
          MEMO Pro
          <span id="sync-badge" class="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-emerald-500/15 text-emerald-400 border border-emerald-500/30">Local Ready</span>
        </h1>
        <p class="text-[11px] text-slate-400" id="stats-line">0 memos • Kokushibu74/MEMO</p>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <button onclick="syncWithGitHub()" id="btn-sync" title="Sync with GitHub" class="p-2 rounded-xl bg-slate-800/90 hover:bg-slate-700 text-cyan-400 border border-slate-700 transition">
        🔄
      </button>
      <button onclick="openSettings()" title="GitHub & Backup Settings" class="p-2 rounded-xl bg-slate-800/90 hover:bg-slate-700 text-slate-300 border border-slate-700 transition">
        ⚙️
      </button>
    </div>
  </header>

  <!-- Search & Category Filter Bar -->
  <section class="px-4 pt-3 space-y-3">
    <div class="relative">
      <input id="search-input" type="text" oninput="renderMemos()" placeholder="মেমো, ট্যাগ বা কোড খুঁজুন..." class="w-full bg-slate-900/90 border border-slate-800 focus:border-indigo-500 rounded-xl pl-10 pr-4 py-2.5 text-sm text-white placeholder-slate-500 outline-none transition" />
      <span class="absolute left-3.5 top-2.5 text-slate-500">🔍</span>
    </div>

    <div class="flex gap-2 overflow-x-auto pb-1 no-scrollbar" id="category-tabs">
      <button onclick="setFilter('all')" data-cat="all" class="cat-btn px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-indigo-600 text-white shrink-0">All Memos</button>
      <button onclick="setFilter('pinned')" data-cat="pinned" class="cat-btn px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-slate-900 text-slate-400 border border-slate-800 shrink-0">📌 Pinned</button>
      <button onclick="setFilter('idea')" data-cat="idea" class="cat-btn px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-slate-900 text-slate-400 border border-slate-800 shrink-0">💡 Ideas</button>
      <button onclick="setFilter('code')" data-cat="code" class="cat-btn px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-slate-900 text-slate-400 border border-slate-800 shrink-0">💻 Code / Termux</button>
      <button onclick="setFilter('task')" data-cat="task" class="cat-btn px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-slate-900 text-slate-400 border border-slate-800 shrink-0">✅ Tasks</button>
      <button onclick="setFilter('personal')" data-cat="personal" class="cat-btn px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-slate-900 text-slate-400 border border-slate-800 shrink-0">🔒 Personal</button>
    </div>
  </section>

  <!-- Memos Grid -->
  <main id="memo-list" class="px-4 pt-3 grid grid-cols-1 md:grid-cols-2 gap-3 flex-1"></main>

  <!-- Floating Action Button -->
  <button onclick="openEditor()" class="fixed bottom-6 right-5 z-30 h-14 px-5 rounded-2xl bg-gradient-to-r from-indigo-500 to-cyan-500 text-slate-950 font-extrabold text-sm shadow-xl shadow-indigo-500/30 flex items-center gap-2 active:scale-95 transition">
    <span class="text-lg">＋</span> New Memo
  </button>

  <!-- Create / Edit Memo Modal -->
  <div id="editor-modal" class="fixed inset-0 z-50 hidden bg-black/75 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-slate-900 border-t sm:border border-slate-800 w-full max-w-lg rounded-t-3xl sm:rounded-2xl p-5 space-y-4 max-h-[92vh] flex flex-col">
      <div class="flex items-center justify-between">
        <h2 id="modal-title" class="text-sm font-bold text-indigo-400 uppercase tracking-wider">New Memo</h2>
        <div class="flex items-center gap-2">
          <button type="button" id="btn-pin-toggle" onclick="toggleEditorPin()" class="px-2.5 py-1 rounded-lg text-xs border border-slate-700 text-slate-400">📌 Pin</button>
          <button onclick="closeEditor()" class="text-slate-400 hover:text-white text-lg px-2">✕</button>
        </div>
      </div>

      <input id="memo-title" type="text" placeholder="মেমোর শিরোনাম (Title)..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-base font-bold text-white outline-none focus:border-indigo-500" />

      <div class="flex gap-2">
        <select id="memo-category" class="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 outline-none">
          <option value="idea">💡 Idea</option>
          <option value="code">💻 Code / Termux</option>
          <option value="task">✅ Task / Checklist</option>
          <option value="personal">🔒 Personal</option>
        </select>
        <input id="memo-tags" type="text" placeholder="Tags (কমা দিয়ে লিখুন: ai, python)" class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 outline-none" />
      </div>

      <textarea id="memo-content" rows="8" placeholder="এখানে বিস্তারিত নোট, কমান্ড বা চেকলিস্ট লিখুন..." class="w-full flex-1 bg-slate-950 border border-slate-800 rounded-xl p-3.5 text-sm text-slate-200 font-mono leading-relaxed outline-none focus:border-indigo-500 resize-none"></textarea>

      <div class="flex justify-between items-center pt-1">
        <button id="btn-delete" onclick="deleteCurrentMemo()" class="hidden px-3.5 py-2.5 rounded-xl bg-rose-500/15 text-rose-400 border border-rose-500/30 text-xs font-semibold">🗑️ Delete</button>
        <div class="flex gap-2 ml-auto">
          <button onclick="copyMemoContent()" class="px-3.5 py-2.5 rounded-xl bg-slate-800 text-slate-300 text-xs font-semibold">📋 Copy</button>
          <button onclick="saveMemo()" class="px-5 py-2.5 rounded-xl bg-indigo-500 hover:bg-indigo-400 text-slate-950 font-bold text-xs">💾 Save Memo</button>
        </div>
      </div>
    </div>
  </div>

  <!-- GitHub Cloud Sync & Backup Settings Modal -->
  <div id="settings-modal" class="fixed inset-0 z-50 hidden bg-black/75 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-2xl p-5 space-y-4">
      <div class="flex items-center justify-between">
        <h2 class="text-sm font-bold text-cyan-400 uppercase tracking-wider">GitHub Cloud Sync & Backup</h2>
        <button onclick="closeSettings()" class="text-slate-400 hover:text-white">✕</button>
      </div>

      <p class="text-xs text-slate-400 leading-relaxed">
        তোমার মেমোগুলো সরাসরি <strong>Kokushibu74/MEMO</strong> রিপোজিটরিতে ব্যাকআপ ও সিঙ্ক করতে নিচে তোমার GitHub Personal Access Token (PAT) দাও।
      </p>

      <div class="space-y-2.5">
        <div>
          <label class="text-[11px] text-slate-400 block mb-1">GitHub Repo (owner/repo)</label>
          <input id="cfg-repo" type="text" value="Kokushibu74/MEMO" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white font-mono" />
        </div>
        <div>
          <label class="text-[11px] text-slate-400 block mb-1">GitHub Personal Access Token (classic/fine-grained)</label>
          <input id="cfg-token" type="password" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white font-mono" />
        </div>
      </div>

      <div class="flex gap-2 pt-1">
        <button onclick="saveSettings()" class="flex-1 py-2.5 bg-cyan-500 text-slate-950 font-bold text-xs rounded-xl">Save Config</button>
        <button onclick="pullFromGitHub()" class="flex-1 py-2.5 bg-slate-800 text-cyan-300 border border-slate-700 font-semibold text-xs rounded-xl">⬇️ Pull from Repo</button>
      </div>

      <hr class="border-slate-800" />

      <div class="flex justify-between gap-2">
        <button onclick="exportJSON()" class="flex-1 py-2 bg-slate-800 hover:bg-slate-700 rounded-xl text-xs text-slate-300">📤 Export JSON</button>
        <label class="flex-1 py-2 bg-slate-800 hover:bg-slate-700 rounded-xl text-xs text-slate-300 text-center cursor-pointer">
          📥 Import JSON
          <input type="file" accept=".json" onchange="importJSON(event)" class="hidden" />
        </label>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'kokushibu74_memo_pro_v1';
    const CFG_KEY = 'kokushibu74_memo_cfg_v1';

    let memos = [];
    let currentFilter = 'all';
    let editingId = null;
    let editorPinned = false;

    // Load initial memos
    function initApp() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        memos = JSON.parse(saved);
      } else {
        memos = [
          {
            id: 'welcome-1',
            title: 'Welcome to MEMO Pro 🚀',
            category: 'idea',
            tags: ['github', 'android', 'memo'],
            content: 'তোমার Kokushibu74/MEMO প্রজেক্টের ফুল-ফাংশনাল অ্যান্ড্রয়েড এবং ওয়েব অ্যাপ রেডি!\n\n- অফলাইনে সব নোট সেভ থাকবে।\n- উপরে ⚙️ আইকনে গিয়ে তোমার GitHub Token দিলে 🔄 বাটনে চাপ দিলেই সব নোট সরাসরি তোমার MEMO রিপোজিটরিতে ব্যাকআপ হয়ে যাবে।',
            pinned: true,
            updatedAt: new Date().toISOString()
          },
          {
            id: 'termux-cmd-2',
            title: 'Termux Quick Git Push Commands',
            category: 'code',
            tags: ['termux', 'git'],
            content: 'git status\ngit add .\ngit commit -m "Update memos"\ngit push origin main',
            pinned: false,
            updatedAt: new Date().toISOString()
          }
        ];
        persistMemos();
      }
      updateSyncBadge();
      renderMemos();
    }

    function persistMemos() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(memos));
      document.getElementById('stats-line').textContent = `${memos.length} memos • Kokushibu74/MEMO`;
    }

    function setFilter(cat) {
      currentFilter = cat;
      document.querySelectorAll('.cat-btn').forEach(btn => {
        if (btn.dataset.cat === cat) {
          btn.className = 'cat-btn px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-indigo-600 text-white shrink-0';
        } else {
          btn.className = 'cat-btn px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-slate-900 text-slate-400 border border-slate-800 shrink-0';
        }
      });
      renderMemos();
    }

    function renderMemos() {
      const list = document.getElementById('memo-list');
      const query = document.getElementById('search-input').value.trim().toLowerCase();

      const filtered = memos
        .filter(m => {
          if (currentFilter === 'pinned' && !m.pinned) return false;
          if (currentFilter !== 'all' && currentFilter !== 'pinned' && m.category !== currentFilter) return false;
          if (!query) return true;
          return (
            m.title.toLowerCase().includes(query) ||
            m.content.toLowerCase().includes(query) ||
            (m.tags && m.tags.some(t => t.toLowerCase().includes(query)))
          );
        })
        .sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0) || new Date(b.updatedAt) - new Date(a.updatedAt));

      document.getElementById('stats-line').textContent = `${memos.length} memos • Kokushibu74/MEMO`;

      if (filtered.length === 0) {
        list.innerHTML = `
          <div class="col-span-full text-center py-16 text-slate-500">
            <p class="text-3xl mb-2">📭</p>
            <p class="text-sm font-medium">কোনো মেমো পাওয়া যায়নি</p>
            <p class="text-xs mt-1">নিচের "+ New Memo" বাটনে ক্লিক করে নতুন নোট তৈরি করো।</p>
          </div>`;
        return;
      }

      const badgeMap = {
        idea: 'bg-amber-500/15 text-amber-300 border-amber-500/30',
        code: 'bg-cyan-500/15 text-cyan-300 border-cyan-500/30',
        task: 'bg-emerald-500/15 text-emerald-300 border-emerald-500/30',
        personal: 'bg-purple-500/15 text-purple-300 border-purple-500/30'
      };

      list.innerHTML = filtered.map(m => {
        const dateStr = new Date(m.updatedAt).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
        const tagsHtml = (m.tags || []).filter(Boolean).map(t => `<span class="text-[10px] px-2 py-0.5 rounded-md bg-slate-800 text-slate-400">#${escapeHtml(t)}</span>`).join('');
        return `
          <article onclick="openEditor('${m.id}')" class="bg-slate-900/90 hover:bg-slate-900 border ${m.pinned ? 'border-indigo-500/50' : 'border-slate-800'} rounded-2xl p-4 flex flex-col justify-between gap-3 cursor-pointer active:scale-[0.99] transition shadow-lg">
            <div class="space-y-2">
              <div class="flex items-start justify-between gap-2">
                <h3 class="font-bold text-sm text-white leading-snug">${escapeHtml(m.title || 'Untitled Memo')}</h3>
                <div class="flex items-center gap-1.5 shrink-0">
                  ${m.pinned ? '<span class="text-xs" title="Pinned">📌</span>' : ''}
                  <span class="text-[10px] font-semibold uppercase px-2 py-0.5 rounded-full border ${badgeMap[m.category] || badgeMap.idea}">${m.category}</span>
                </div>
              </div>
              <pre class="text-xs text-slate-300 font-sans whitespace-pre-wrap line-clamp-4 leading-relaxed">${escapeHtml(m.content)}</pre>
            </div>
            <div class="flex items-center justify-between pt-2 border-t border-slate-800/70">
              <div class="flex flex-wrap gap-1">${tagsHtml}</div>
              <span class="text-[10px] text-slate-500 shrink-0">${dateStr}</span>
            </div>
          </article>
        `;
      }).join('');
    }

    function openEditor(id = null) {
      editingId = id;
      const modal = document.getElementById('editor-modal');
      const delBtn = document.getElementById('btn-delete');

      if (id) {
        const m = memos.find(x => x.id === id);
        if (!m) return;
        document.getElementById('modal-title').textContent = 'Edit Memo';
        document.getElementById('memo-title').value = m.title;
        document.getElementById('memo-category').value = m.category || 'idea';
        document.getElementById('memo-tags').value = (m.tags || []).join(', ');
        document.getElementById('memo-content').value = m.content;
        editorPinned = !!m.pinned;
        delBtn.classList.remove('hidden');
      } else {
        document.getElementById('modal-title').textContent = 'New Memo';
        document.getElementById('memo-title').value = '';
        document.getElementById('memo-category').value = 'idea';
        document.getElementById('memo-tags').value = '';
        document.getElementById('memo-content').value = '';
        editorPinned = false;
        delBtn.classList.add('hidden');
      }
      updatePinButtonUI();
      modal.classList.remove('hidden');
    }

    function closeEditor() {
      document.getElementById('editor-modal').classList.add('hidden');
    }

    function toggleEditorPin() {
      editorPinned = !editorPinned;
      updatePinButtonUI();
    }

    function updatePinButtonUI() {
      const btn = document.getElementById('btn-pin-toggle');
      btn.className = editorPinned
        ? 'px-2.5 py-1 rounded-lg text-xs border border-indigo-500 bg-indigo-500/20 text-indigo-300 font-semibold'
        : 'px-2.5 py-1 rounded-lg text-xs border border-slate-700 text-slate-400';
    }

    function saveMemo() {
      const title = document.getElementById('memo-title').value.trim();
      const category = document.getElementById('memo-category').value;
      const tags = document.getElementById('memo-tags').value.split(',').map(s => s.trim()).filter(Boolean);
      const content = document.getElementById('memo-content').value;

      if (!title && !content.trim()) {
        alert('অনুগ্রহ করে টাইটেল অথবা মেমো টেক্সট লিখুন!');
        return;
      }

      if (editingId) {
        const idx = memos.findIndex(x => x.id === editingId);
        if (idx > -1) {
          memos[idx] = { ...memos[idx], title, category, tags, content, pinned: editorPinned, updatedAt: new Date().toISOString() };
        }
      } else {
        memos.unshift({
          id: 'memo-' + Date.now(),
          title: title || 'Quick Memo',
          category,
          tags,
          content,
          pinned: editorPinned,
          updatedAt: new Date().toISOString()
        });
      }

      persistMemos();
      renderMemos();
      closeEditor();
    }

    function deleteCurrentMemo() {
      if (!editingId) return;
      if (!confirm('এই মেমোটি মুছে ফেলতে চাও?')) return;
      memos = memos.filter(x => x.id !== editingId);
      persistMemos();
      renderMemos();
      closeEditor();
    }

    function copyMemoContent() {
      const text = document.getElementById('memo-content').value;
      navigator.clipboard.writeText(text);
      alert('ক্লিপবোর্ডে কপি হয়েছে!');
    }

    // --- GitHub API Cloud Sync (Directly pushes/pulls notes/memo-data.json in Kokushibu74/MEMO) ---
    function openSettings() {
      const cfg = JSON.parse(localStorage.getItem(CFG_KEY) || '{}');
      document.getElementById('cfg-repo').value = cfg.repo || 'Kokushibu74/MEMO';
      document.getElementById('cfg-token').value = cfg.token || '';
      document.getElementById('settings-modal').classList.remove('hidden');
    }

    function closeSettings() {
      document.getElementById('settings-modal').classList.add('hidden');
    }

    function saveSettings() {
      const repo = document.getElementById('cfg-repo').value.trim() || 'Kokushibu74/MEMO';
      const token = document.getElementById('cfg-token').value.trim();
      localStorage.setItem(CFG_KEY, JSON.stringify({ repo, token }));
      updateSyncBadge();
      closeSettings();
    }

    function updateSyncBadge() {
      const cfg = JSON.parse(localStorage.getItem(CFG_KEY) || '{}');
      const badge = document.getElementById('sync-badge');
      if (cfg.token) {
        badge.textContent = 'GitHub Connected';
        badge.className = 'text-[10px] font-semibold px-2 py-0.5 rounded-full bg-cyan-500/15 text-cyan-300 border border-cyan-500/30';
      } else {
        badge.textContent = 'Local Ready';
        badge.className = 'text-[10px] font-semibold px-2 py-0.5 rounded-full bg-emerald-500/15 text-emerald-400 border border-emerald-500/30';
      }
    }

    async function syncWithGitHub() {
      const cfg = JSON.parse(localStorage.getItem(CFG_KEY) || '{}');
      if (!cfg.token) {
        openSettings();
        return;
      }

      const badge = document.getElementById('sync-badge');
      badge.textContent = 'Syncing...';
      const path = 'notes/memo-backup.json';
      const apiUrl = `https://api.github.com/repos/${cfg.repo}/contents/${path}`;

      try {
        let sha = null;
        const getRes = await fetch(apiUrl, {
          headers: { Authorization: `token ${cfg.token}`, Accept: 'application/vnd.github.v3+json' }
        });
        if (getRes.ok) {
          const fileData = await getRes.json();
          sha = fileData.sha;
        }

        const payload = {
          message: `Sync ${memos.length} memos from MEMO Pro Android App`,
          content: btoa(unescape(encodeURIComponent(JSON.stringify(memos, null, 2))))
        };
        if (sha) payload.sha = sha;

        const putRes = await fetch(apiUrl, {
          method: 'PUT',
          headers: {
            Authorization: `token ${cfg.token}`,
            Accept: 'application/vnd.github.v3+json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });

        if (putRes.ok) {
          badge.textContent = 'Synced ✓';
          alert(`সফলভাবে ${cfg.repo} রিপোজিটরিতে সিঙ্ক হয়েছে!`);
        } else {
          const err = await putRes.json();
          throw new Error(err.message || 'Sync failed');
        }
      } catch (e) {
        badge.textContent = 'Sync Error';
        alert('GitHub Sync Error: ' + e.message);
      }
    }

    async function pullFromGitHub() {
      const cfg = JSON.parse(localStorage.getItem(CFG_KEY) || '{}');
      if (!cfg.token) {
        alert('প্রথমে GitHub Token দিয়ে Save Config করো!');
        return;
      }
      const apiUrl = `https://api.github.com/repos/${cfg.repo}/contents/notes/memo-backup.json`;
      try {
        const res = await fetch(apiUrl, {
          headers: { Authorization: `token ${cfg.token}`, Accept: 'application/vnd.github.v3+json' }
        });
        if (!res.ok) throw new Error('Backup file not found in repository yet.');
        const data = await res.json();
        const decoded = decodeURIComponent(escape(atob(data.content.replace(/\n/g, ''))));
        const remoteMemos = JSON.parse(decoded);
        if (Array.isArray(remoteMemos)) {
          memos = remoteMemos;
          persistMemos();
          renderMemos();
          closeSettings();
          alert(`রিপোজিটরি থেকে ${memos.length}টি মেমো রিস্টোর হয়েছে!`);
        }
      } catch (e) {
        alert('Pull failed: ' + e.message);
      }
    }

    function exportJSON() {
      const blob = new Blob([JSON.stringify(memos, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `memo-pro-backup-${Date.now()}.json`;
      a.click();
    }

    function importJSON(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const imported = JSON.parse(reader.result);
          if (Array.isArray(imported)) {
            memos = imported;
            persistMemos();
            renderMemos();
            closeSettings();
            alert('সফলভাবে মেমো ইমপোর্ট হয়েছে!');
          }
        } catch (err) {
          alert('Invalid JSON file');
        }
      };
      reader.readAsText(file);
    }

    function escapeHtml(str) {
      return String(str || '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
    }

    initApp();
  </script>
</body>
</html>
