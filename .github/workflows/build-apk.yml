name: Build Memo WhatsApp AI 2.0 APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: memo-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Automated Security & Feature Verification Tests
        run: |
          python3 - << 'PYTEST'
          with open("index.html", "r", encoding="utf-8") as f:
              html = f.read()
          assert 'value="+88"' in html, "Missing +88 default country code"
          assert 'value="" placeholder="01XXXXXXXXX' in html, "Phone number field must be empty by default"
          assert 'handleIncomingClientMessage' in html, "Missing incoming chat handler"
          assert 'sendManualMessageToClient' in html, "Missing manual send handler"
          assert 'handleSafeModelZipUpload' in html, "Missing ZIP local model uploader"
          assert 'triggerRateLimitCountdown' in html, "Missing API limit countdown"
          assert 'DLT2' not in html, "Fake static code must not exist"
          assert 'memoWaFab' not in html, "Obsolete bottom-right WhatsApp floating button must be removed"
          assert 'MEMO_AI_2_0_CONNECTED' not in html, "Fake QR link must not exist"
          assert 'd.waConnected === true && !state.waLinked' in html, "WhatsApp login must auto-link only after live gateway confirmation"
          assert 'api.qrserver.com' not in html, "Session QR must not be sent to a third-party QR service"
          assert 'id="wa-gateway-token"' in html, "Gateway token field is required"
          assert 'gatewayToken: ""' in html, "Gateway token state default is missing"
          assert 'clients: {\n        "+8801700000001": {' not in html, "Seeded demo chat must not be shipped"
          server = open("server/index.js", encoding="utf-8").read()
          assert 'X-MEMO-Token' in server, "Gateway endpoints must require a token"
          assert "app.use('/ack', requireGatewayToken);" in server, "Message acknowledgement endpoint must be protected"
          assert "app.post('/ack'" in server, "Manual mode acknowledgement endpoint is missing"
          assert 'MEMO_GATEWAY_TOKEN' in open("render.yaml", encoding="utf-8").read(), "Render must configure gateway auth"
          assert 'mountPath: /var/data' in open("render.yaml", encoding="utf-8").read(), "WhatsApp auth must use persistent storage"
          import re
          scripts = re.findall(r'<script>(.*?)</script>', html, re.S)
          assert scripts, "Missing app JavaScript"
          open('/tmp/memo-ui-check.js', 'w', encoding='utf-8').write(scripts[-1])
          print("✅ UI, real-session, token-auth, persistent-disk and no-demo checks passed!")
          PYTEST
          node --check /tmp/memo-ui-check.js
          node --check server/index.js

      - name: Build Capacitor Android APK
        run: |
          mkdir -p www
          cp -f index.html www/index.html
          python3 make_icon.py
          rm -rf android package.json package-lock.json capacitor.config.json
          npm init -y
          npm install @capacitor/core@6.0.0 @capacitor/cli@6.0.0 @capacitor/android@6.0.0
          node -e 'require("fs").writeFileSync("capacitor.config.json", JSON.stringify({appId:"com.shihab.memo20",appName:"MEMO 2.0",webDir:"www",bundledWebRuntime:false},null,2));'
          npx cap add android
          npx cap copy android
          rm -rf android/app/src/main/res/mipmap-anydpi-v26 android/app/src/main/res/drawable-anydpi-v24
          for dir in android/app/src/main/res/mipmap-*; do
            if [ -d "$dir" ]; then
              cp -f www/icon.png "$dir/ic_launcher.png"
              cp -f www/icon.png "$dir/ic_launcher_round.png"
              cp -f www/icon.png "$dir/ic_launcher_foreground.png"
            fi
          done
          node -e 'const fs=require("fs"),p="android/app/src/main/AndroidManifest.xml";let x=fs.readFileSync(p,"utf8");x=x.replace("<application","<application android:usesCleartextTraffic=\"true\"");x=x.replace("</manifest>","<uses-permission android:name=\"android.permission.WAKE_LOCK\"/><uses-permission android:name=\"android.permission.FOREGROUND_SERVICE\"/></manifest>");fs.writeFileSync(p,x);'
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Installable APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Memo-WhatsApp-AI-2.0-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
