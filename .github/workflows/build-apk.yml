name: Build MEMO 2.0 Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Web Files & Generate MEMO 2.0 App Icon via Node
        run: |
          mkdir -p www
          cp -f index.html www/index.html || true
          cat << 'ICONJS' > make_icon.js
          const zlib = require('zlib');
          const fs = require('fs');
          const width = 256, height = 256;
          const rawData = Buffer.alloc(height * (width * 4 + 1));
          for (let y = 0; y < height; y++) {
            let rowStart = y * (width * 4 + 1);
            rawData[rowStart] = 0;
            for (let x = 0; x < width; x++) {
              let idx = rowStart + 1 + x * 4;
              let dx = x - 128, dy = y - 128;
              let dist = Math.sqrt(dx * dx + dy * dy);
              let r = 6, g = 9, b = 20;
              // Outer Neon Cyan Ring
              if (dist > 102 && dist < 114) { r = 0; g = 245; b = 212; }
              // Inner Neon Pink Ring
              else if (dist > 88 && dist < 94) { r = 255; g = 0; b = 127; }
              // Glowing "M" Logo in Center
              let inM = false;
              if (y >= 80 && y <= 176) {
                if (x >= 72 && x <= 90) inM = true;
                if (x >= 166 && x <= 184) inM = true;
                if (Math.abs((x - 76) - (y - 80) * 0.55) < 9 && x <= 128) inM = true;
                if (Math.abs((180 - x) - (y - 80) * 0.55) < 9 && x >= 128) inM = true;
              }
              if (inM) { r = 0; g = 245; b = 212; }
              rawData[idx] = r; rawData[idx+1] = g; rawData[idx+2] = b; rawData[idx+3] = 255;
            }
          }
          function crc32(buf) {
            let c = -1;
            for (let i = 0; i < buf.length; i++) {
              c = (c >>> 8) ^ crcTable[(c ^ buf[i]) & 0xff];
            }
            return (c ^ -1) >>> 0;
          }
          const crcTable = new Uint32Array(256);
          for (let n = 0; n < 256; n++) {
            let c = n;
            for (let k = 0; k < 8; k++) c = (c & 1) ? (0xedb88320 ^ (c >>> 1)) : (c >>> 1);
            crcTable[n] = c;
          }
          function chunk(type, data) {
            let len = Buffer.alloc(4); len.writeUInt32BE(data.length, 0);
            let t = Buffer.from(type);
            let crc = Buffer.alloc(4); crc.writeUInt32BE(crc32(Buffer.concat([t, data])), 0);
            return Buffer.concat([len, t, data, crc]);
          }
          let ihdr = Buffer.alloc(13);
          ihdr.writeUInt32BE(width, 0); ihdr.writeUInt32BE(height, 4);
          ihdr[8] = 8; ihdr[9] = 6; ihdr[10] = 0; ihdr[11] = 0; ihdr[12] = 0;
          let png = Buffer.concat([
            Buffer.from([137,80,78,71,13,10,26,10]),
            chunk('IHDR', ihdr),
            chunk('IDAT', zlib.deflateSync(rawData)),
            chunk('IEND', Buffer.alloc(0))
          ]);
          fs.writeFileSync('icon.png', png);
          ICONJS
          node make_icon.js

      - name: Build Capacitor v6 Android Project
        run: |
          rm -rf android package.json package-lock.json node_modules
          npm init -y
          npm install @capacitor/core@6.0.0 @capacitor/cli@6.0.0 @capacitor/android@6.0.0
          cat << 'CAPJSON' > capacitor.config.json
          {
            "appId": "com.shihab.memo20",
            "appName": "MEMO 2.0",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          CAPJSON
          npx cap add android
          npx cap copy android
          for f in $(find android/app/src/main/res -name "ic_launcher*.png"); do
            cp -f icon.png "$f"
          done

      - name: Compile APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload MEMO 2.0 APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MEMO-2.0-iOS26-Glass-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
