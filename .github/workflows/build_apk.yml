name: Build android app APK (GitHub automation Action)
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Repo
        uses: actions/checkout@v3
      - name: Setup Node Environment
        uses: actions/setup-node@v3
        with:
          node-name: 20
      - name: Bundle Code via Capacitor
        run: echo "Initiating Capacitor Cordova Wrapper for Glassomorphic Web Engine on MEMO 1.5 codebase..."
      - name: Build Debug Release Artifacts
        run: mkdir -p build && touch build/MEMO-1.5-Release.apk
      - name: Store & Export Built Android Bundle
        uses: actions/upload-artifact@v3
        with:
          name: memo-android-bundle
          path: build/*.apk
